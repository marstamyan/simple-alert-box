services:
  db:
    image: mariadb:10.11
    ports:
      - "127.0.0.1:33317:3306"
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-test-password
      MARIADB_ROOT_PASSWORD: local-test-root-password
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/mysql
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8097:80"
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-test-password
      WORDPRESS_DEBUG: "1"
    volumes: &wordpress-volumes
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/simple-alert-box:ro
  cli:
    image: wordpress:cli-php${MK_ALERT_PHP:-8.3}
    entrypoint: [wp]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-environment
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wordpress-volumes
volumes:
  database:
  wordpress:
